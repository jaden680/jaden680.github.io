<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>해열노트 가족 초대</title>
<style>body{margin:0;background:#fafaf9;color:#24372f;font:17px/1.6 system-ui,sans-serif}main{max-width:420px;margin:12vh auto;padding:28px}h1{font-size:30px;line-height:1.3}a,button{display:block;box-sizing:border-box;width:100%;padding:15px;margin:12px 0;border:0;border-radius:16px;text-align:center;font:inherit;text-decoration:none;background:#285f53;color:white;cursor:pointer}.secondary{background:#e6eeea;color:#24372f}#code{font:32px monospace;letter-spacing:5px}p{color:#596b61}small{display:block;color:#596b61}</style></head>
<body><main><h1>가족과 함께<br>기록해요</h1><p id="intro">가족 초대 링크를 확인하고 있어요.</p><section id="valid" hidden><div id="code"></div><a id="open">앱에서 가족 참여</a><a class="secondary" href="https://apps.apple.com/kr/app/id6816283227" rel="noreferrer">아이폰 앱 설치</a><p>아직 앱이 없다면 설치한 뒤 이 페이지로 돌아와 <b>앱에서 가족 참여</b>를 눌러 주세요. 코드가 입력된 참여 화면이 열려요.</p><button class="secondary" id="copy">가족 코드 복사</button><small>구버전 앱에서는 ‘코드로 참여해요’에 코드를 붙여 넣어 주세요. 초대한 가족만 기록을 함께 볼 수 있으니 링크를 공개하지 마세요.</small><p id="status" role="status"></p></section><a href="./index.html" class="secondary">해열노트 소개</a></main>
<script>
const code=location.hash.slice(1).toUpperCase();
if(/^[A-Z0-9]{6}$/.test(code)){
 document.getElementById('intro').textContent='초대받은 가족에 참여하면 체온과 복용 기록을 함께 볼 수 있어요.';
 document.getElementById('valid').hidden=false;
 document.getElementById('code').textContent=code;
 document.getElementById('open').href='fevernote://invite/'+code;
 document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('status').textContent='가족 코드를 복사했어요.';}catch{document.getElementById('status').textContent='위의 코드를 길게 눌러 복사해 주세요.';}};
}else{document.getElementById('intro').textContent='올바른 초대 코드가 없어요. 가족에게 링크를 다시 받아 주세요.';}
</script></body></html>
